<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CE Innovation Center Dashboard</title>

<!-- Tailwind CSS via Play CDN -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- Custom CSS -->
<style>
  html, body { margin: 0; background: #f8fafc; }
  .line-clamp-3 {
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
</style>

<!-- Import map for React, lucide-react, PapaParse via ESM CDN -->
<script type="importmap">
{
  "imports": {
    "react":              "https://esm.sh/react@18.3.1",
    "react/jsx-runtime":  "https://esm.sh/react@18.3.1/jsx-runtime",
    "react-dom/client":   "https://esm.sh/react-dom@18.3.1/client",
    "lucide-react":       "https://esm.sh/lucide-react@0.383.0?deps=react@18.3.1",
    "papaparse":          "https://esm.sh/papaparse@5.4.1"
  }
}
</script>

<!-- Babel for in-browser JSX transpilation -->
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-type="module" data-presets="react">
import React, { useState, useEffect } from 'react';
import { createRoot } from 'react-dom/client';
import Papa from 'papaparse';
import {
  Sparkles, Rocket, Clock, ListTodo, Zap, AlertCircle, Loader2, User, TrendingUp,
  Bot, FileCode, Workflow, BarChart3, MessageSquare, Wrench, X, Search,
  ArrowUp, ArrowDown, ArrowUpDown, ExternalLink, BookOpen, Lightbulb, Hammer,
  ChevronDown, ListChecks, Flag, PartyPopper, CheckCircle2, Inbox, HelpCircle,
  Layers, Cpu, Cloud, Cog, Database, Boxes, Puzzle, Globe, Code, Brain, Wand2, Gauge
} from 'lucide-react';

/* ============================================================
   CONFIGURATION — REPLACE THESE WITH YOUR ACTUAL CSV URLs
   ============================================================
   You can use:
   - Raw GitHub URLs: https://raw.githubusercontent.com/USER/REPO/main/data/file.csv
   - Relative paths if the CSVs sit alongside this file: ./data/file.csv
   - Any public CSV URL
   ============================================================ */
const CSV_URLS = {
  approvedInnovations: './Approved Innovations (4).csv',
  promptLibrary:       './CLX AI Prompt Library (2).csv',
  shareYourProject:    './Share your project (11).csv',
  workItems:           './Work Items (2).csv',
};

// Update this each sprint cycle
const CURRENT_SPRINT = '2026 S4 (May 5 - May 26)';
/* ============================================================ */

const Dashboard = () => {
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [approved, setApproved] = useState([]);
  const [prompts, setPrompts] = useState([]);
  const [active, setActive] = useState([]);
  const [allProjects, setAllProjects] = useState([]);
  const [workItems, setWorkItems] = useState([]);
  const [selectedType, setSelectedType] = useState(null);
  const [selectedKpi, setSelectedKpi] = useState(null);
  const [selectedSprint, setSelectedSprint] = useState(null);
  const [searchQuery, setSearchQuery] = useState('');
  const [sortConfig, setSortConfig] = useState({ key: 'percent', direction: 'desc' });
  const [navOpen, setNavOpen] = useState(false);
  const [selectedSprintFilter, setSelectedSprintFilter] = useState(CURRENT_SPRINT);

  // ---------- Helpers ----------
  const cleanValue = (v) => {
    if (v === null || v === undefined || v === '') return '';
    if (typeof v === 'number' || typeof v === 'boolean') return v;
    if (Array.isArray(v)) return v.map(cleanValue).filter(Boolean).join(', ');
    if (typeof v === 'object') {
      if (v.Value !== undefined) return cleanValue(v.Value);
      if (v.DisplayName !== undefined) return cleanValue(v.DisplayName);
      if (v.results && Array.isArray(v.results)) return v.results.map(cleanValue).filter(Boolean).join(', ');
      return '';
    }
    const s = String(v).trim();
    if ((s.startsWith('{') && s.endsWith('}')) || (s.startsWith('[') && s.endsWith(']'))) {
      try {
        const parsed = JSON.parse(s);
        return cleanValue(parsed);
      } catch (e) {
        const valMatch = s.match(/"Value"\s*:\s*"([^"]+)"/);
        if (valMatch) return valMatch[1];
        const nameMatch = s.match(/"DisplayName"\s*:\s*"([^"]+)"/);
        if (nameMatch) return nameMatch[1];
        return s;
      }
    }
    return s;
  };

  const getField = (row, ...keys) => {
    for (const k of keys) {
      if (row[k] !== undefined && row[k] !== null && row[k] !== '') {
        return cleanValue(row[k]);
      }
    }
    return '';
  };

  const normalizePercent = (v) => {
    if (v === null || v === undefined || v === '') return 0;
    let n = typeof v === 'number' ? v : parseFloat(String(v).replace('%', '').trim());
    if (isNaN(n)) return 0;
    if (n > 0 && n <= 1) n = n * 100;
    return Math.max(0, Math.min(100, Math.round(n)));
  };

  const stripHtml = (raw) => {
    if (raw === null || raw === undefined) return '';
    let s = String(raw);
    s = s.replace(/<\s*(br|\/p|\/div|\/li|\/h[1-6])\s*\/?>/gi, '\n');
    s = s.replace(/<[^>]+>/g, '');
    const entities = {
      '&nbsp;': ' ', '&amp;': '&', '&lt;': '<', '&gt;': '>', '&quot;': '"',
      '&#39;': "'", '&apos;': "'", '&rsquo;': '\u2019', '&lsquo;': '\u2018',
      '&rdquo;': '\u201D', '&ldquo;': '\u201C', '&mdash;': '\u2014',
      '&ndash;': '\u2013', '&hellip;': '\u2026',
    };
    s = s.replace(/&[a-z#0-9]+;/gi, (m) => {
      if (entities[m.toLowerCase()] !== undefined) return entities[m.toLowerCase()];
      const num = m.match(/^&#(\d+);$/);
      if (num) { try { return String.fromCharCode(parseInt(num[1], 10)); } catch (e) { return ''; } }
      return '';
    });
    s = s.replace(/[ \t]+/g, ' ').replace(/\n{3,}/g, '\n\n').trim();
    return s;
  };

  // ---------- Load & parse CSVs from URLs ----------
  useEffect(() => {
    const parseFile = (url, label) =>
      new Promise(async (resolve, reject) => {
        try {
          if (!url || url.startsWith('YOUR_')) {
            reject(new Error(`Placeholder URL not replaced for "${label}". Update CSV_URLS at the top of this file.`));
            return;
          }
          const response = await fetch(url);
          if (!response.ok) throw new Error(`HTTP ${response.status} while fetching ${label}`);
          const text = await response.text();
          Papa.parse(text, {
            header: true,
            dynamicTyping: true,
            skipEmptyLines: true,
            transformHeader: (h) => h.trim(),
            complete: (results) => resolve(results.data),
            error: (err) => reject(err),
          });
        } catch (err) {
          reject(err);
        }
      });

    const load = async () => {
      try {
        const [approvedRows, promptRows, activeRows, workItemRows] = await Promise.all([
          parseFile(CSV_URLS.approvedInnovations, 'Approved Innovations'),
          parseFile(CSV_URLS.promptLibrary,       'Prompt Library'),
          parseFile(CSV_URLS.shareYourProject,    'Share Your Project'),
          parseFile(CSV_URLS.workItems,           'Work Items'),
        ]);

        const approvedClean = approvedRows
          .filter((r) => r && getField(r, 'Title'))
          .map((r) => ({
            title: getField(r, 'Title'),
            solutionType: getField(r, 'Solution Type', 'SolutionType') || 'Other',
          }));

        const promptClean = promptRows
          .filter((r) => r && getField(r, 'Title'))
          .map((r) => ({
            title: getField(r, 'Title'),
            solutionType: 'Prompt',
          }));

        const allProjectsClean = activeRows
          .filter((r) => r && getField(r, 'Title'))
          .map((r) => {
            const status = getField(r, 'Status');
            const progress = getField(r, 'Progress');
            const archive = r['Archive'];
            const archiveStr = String(cleanValue(archive)).toLowerCase().trim();
            const title = getField(r, 'Title');
            let expert = getField(
              r, 'Innovation Expert/Partner', 'AIExpert_x002f_Partner',
              'Innovation Expert', 'AI Expert/Partner'
            );

            const titleNorm = String(title).trim().toLowerCase();
            let percentLabel = null;

            if (titleNorm === 'ai colleague') {
              const hasJennifer = String(expert).toLowerCase().includes('jennifer carr');
              if (!hasJennifer) expert = expert ? `${expert}, Jennifer Carr` : 'Jennifer Carr';
            }
            if (titleNorm === 'aeo/geo') {
              percentLabel = 'To be updated';
            }

            return {
              title, status, progress,
              priority: getField(r, 'Priority'),
              sprint: getField(r, 'Sprint'),
              archive, archiveStr, expert,
              percent: normalizePercent(getField(r, '% Completion', 'OData__x0025__x0020_Completion', 'Percent Complete')),
              percentLabel,
              solutionType: getField(r, 'Solution Type', 'SolutionType'),
            };
          });

        const activeClean = allProjectsClean.filter((row) => {
          const s = String(row.status).toLowerCase();
          const p = String(row.progress).toLowerCase();
          const a = row.archiveStr;
          if (s === 'approved' || s === 'archived') return false;
          if (p === 'approved' || p === 'archived') return false;
          if (a === 'approved' || a === 'archived' || a === 'yes' || a === 'true' || a === 'y' || a === '1' || a === 'checked') return false;
          return true;
        });

        const workItemsClean = workItemRows
          .filter((r) => r && (getField(r, 'Title') || getField(r, 'Project')))
          .map((r) => ({
            project:     getField(r, 'Project'),
            itemType:    getField(r, 'Item Type', 'ItemType'),
            title:       getField(r, 'Title'),
            description: stripHtml(getField(r, 'Description')),
            assignedTo:  getField(r, 'Assigned To', 'AssignedTo'),
            status:      getField(r, 'Status'),
            percent:     normalizePercent(getField(r, '% Complete', 'Percent Complete', 'PercentComplete')),
            priority:    getField(r, 'Priority'),
          }));

        setApproved(approvedClean);
        setPrompts(promptClean);
        setAllProjects(allProjectsClean);
        setActive(activeClean);
        setWorkItems(workItemsClean);
        setLoading(false);
      } catch (err) {
        console.error(err);
        setError(err.message || 'Failed to load data');
        setLoading(false);
      }
    };

    load();
  }, []);

  // ---------- Derived data ----------
  const completedAll = [...approved, ...prompts];
  const totalCompleted = completedAll.length;

  const typeCounts = completedAll.reduce((acc, item) => {
    const t = item.solutionType || 'Other';
    acc[t] = (acc[t] || 0) + 1;
    return acc;
  }, {});

  // Canonical mappings — known types get their dedicated color + icon
  const TYPE_OVERRIDES = {
    'Prompt':     { bg: 'bg-violet-100',  text: 'text-violet-800',  ring: 'ring-violet-200',  icon: MessageSquare },
    'Agent':      { bg: 'bg-blue-100',    text: 'text-blue-800',    ring: 'ring-blue-200',    icon: Bot },
    'Automation': { bg: 'bg-emerald-100', text: 'text-emerald-800', ring: 'ring-emerald-200', icon: Workflow },
    'Script':     { bg: 'bg-amber-100',   text: 'text-amber-800',   ring: 'ring-amber-200',   icon: FileCode },
    'Workflow':   { bg: 'bg-teal-100',    text: 'text-teal-800',    ring: 'ring-teal-200',    icon: Workflow },
    'Dashboard':  { bg: 'bg-indigo-100',  text: 'text-indigo-800',  ring: 'ring-indigo-200',  icon: BarChart3 },
    'Custom GPT': { bg: 'bg-pink-100',    text: 'text-pink-800',    ring: 'ring-pink-200',    icon: Brain },
    'Tool':       { bg: 'bg-cyan-100',    text: 'text-cyan-800',    ring: 'ring-cyan-200',    icon: Wand2 },
    'Integration':{ bg: 'bg-fuchsia-100', text: 'text-fuchsia-800', ring: 'ring-fuchsia-200', icon: Puzzle },
    'Template':   { bg: 'bg-rose-100',    text: 'text-rose-800',    ring: 'ring-rose-200',    icon: Layers },
    'API':        { bg: 'bg-orange-100',  text: 'text-orange-800',  ring: 'ring-orange-200',  icon: Code },
    'Bot':        { bg: 'bg-sky-100',     text: 'text-sky-800',     ring: 'ring-sky-200',     icon: Bot },
    'Chatbot':    { bg: 'bg-purple-100',  text: 'text-purple-800',  ring: 'ring-purple-200',  icon: MessageSquare },
    'Knowledge Base': { bg: 'bg-lime-100', text: 'text-lime-800',   ring: 'ring-lime-200',    icon: BookOpen },
    'Report':     { bg: 'bg-stone-100',   text: 'text-stone-800',   ring: 'ring-stone-200',   icon: Gauge },
  };

  // Fallback palette for any type not in TYPE_OVERRIDES — deterministic by name
  const TYPE_PALETTE = [
    { bg: 'bg-pink-100',    text: 'text-pink-800',    ring: 'ring-pink-200',    icon: Sparkles },
    { bg: 'bg-rose-100',    text: 'text-rose-800',    ring: 'ring-rose-200',    icon: Cpu },
    { bg: 'bg-orange-100',  text: 'text-orange-800',  ring: 'ring-orange-200',  icon: Cog },
    { bg: 'bg-yellow-100',  text: 'text-yellow-800',  ring: 'ring-yellow-200',  icon: Lightbulb },
    { bg: 'bg-lime-100',    text: 'text-lime-800',    ring: 'ring-lime-200',    icon: Boxes },
    { bg: 'bg-cyan-100',    text: 'text-cyan-800',    ring: 'ring-cyan-200',    icon: Cloud },
    { bg: 'bg-sky-100',     text: 'text-sky-800',     ring: 'ring-sky-200',     icon: Globe },
    { bg: 'bg-purple-100',  text: 'text-purple-800',  ring: 'ring-purple-200',  icon: Brain },
    { bg: 'bg-fuchsia-100', text: 'text-fuchsia-800', ring: 'ring-fuchsia-200', icon: Database },
    { bg: 'bg-stone-100',   text: 'text-stone-800',   ring: 'ring-stone-200',   icon: Wrench },
  ];

  const hashString = (s) => {
    let h = 0;
    const str = String(s);
    for (let i = 0; i < str.length; i++) {
      h = ((h << 5) - h) + str.charCodeAt(i);
      h |= 0;
    }
    return Math.abs(h);
  };

  const getTypeStyle = (t) => {
    if (TYPE_OVERRIDES[t]) return TYPE_OVERRIDES[t];
    if (!t) return TYPE_PALETTE[0];
    return TYPE_PALETTE[hashString(t) % TYPE_PALETTE.length];
  };

  const pipelineCount = active.filter((r) => String(r.progress).toLowerCase() === 'not started').length;
  const inProgressCount = active.filter((r) => {
    const p = String(r.progress).toLowerCase();
    return p && p !== 'approved' && p !== 'on hold' && p !== 'not started';
  }).length;

  // Unique, sorted list of sprints from the data (newest first by year + sprint number).
  // Excludes blanks and "N/A"-style placeholders.
  const availableSprints = Array.from(
    new Set(
      allProjects
        .map((r) => String(r.sprint).trim())
        .filter((s) => {
          if (!s) return false;
          const v = s.toLowerCase();
          return v !== 'n/a' && v !== 'na' && v !== 'none' && v !== 'tbd' && v !== '-';
        })
    )
  ).sort((a, b) => {
    const parseKey = (s) => {
      const m = s.match(/^(\d{4})\s+S(\d+)/i);
      return m ? [parseInt(m[1], 10), parseInt(m[2], 10)] : [0, 0];
    };
    const [ay, an] = parseKey(a);
    const [by, bn] = parseKey(b);
    if (ay !== by) return by - ay;
    return bn - an;
  });

  // Use the dropdown selection; if it's not present in the data, fall back to the newest sprint
  const activeSprintFilter = availableSprints.includes(selectedSprintFilter)
    ? selectedSprintFilter
    : (availableSprints[0] || CURRENT_SPRINT);

  const sprintItems = allProjects
    .filter((r) => String(r.sprint).trim() === activeSprintFilter)
    .sort((a, b) => b.percent - a.percent);

  const sortedActive = [...active]
    .filter((r) => String(r.progress).toLowerCase() !== 'on hold')
    .sort((a, b) => {
      const { key, direction } = sortConfig;
      const dir = direction === 'asc' ? 1 : -1;
      const av = a[key]; const bv = b[key];
      if (key === 'percent') return ((av || 0) - (bv || 0)) * dir;
      const as = String(av || '').toLowerCase();
      const bs = String(bv || '').toLowerCase();
      if (as < bs) return -1 * dir;
      if (as > bs) return 1 * dir;
      return 0;
    });

  const searchTerm = searchQuery.trim().toLowerCase();
  const filteredActive = searchTerm
    ? sortedActive.filter((item) => {
        const haystack = [item.title, item.expert, item.progress]
          .map((v) => String(v || '').toLowerCase()).join(' | ');
        return haystack.includes(searchTerm);
      })
    : sortedActive;

  const allActiveCount = active.filter((r) => String(r.progress).toLowerCase() !== 'on hold').length;

  const handleSort = (key) => {
    setSortConfig((prev) => {
      if (prev.key === key) return { key, direction: prev.direction === 'asc' ? 'desc' : 'asc' };
      return { key, direction: key === 'percent' ? 'desc' : 'asc' };
    });
  };

  const SortIcon = ({ columnKey }) => {
    if (sortConfig.key !== columnKey) return <ArrowUpDown className="w-3.5 h-3.5 text-slate-400" />;
    return sortConfig.direction === 'asc'
      ? <ArrowUp className="w-3.5 h-3.5 text-indigo-600" />
      : <ArrowDown className="w-3.5 h-3.5 text-indigo-600" />;
  };

  // ---------- Loading / error ----------
  if (loading) {
    return (
      <div className="min-h-screen bg-slate-50 flex items-center justify-center">
        <div className="flex flex-col items-center gap-3 text-slate-600">
          <Loader2 className="w-10 h-10 animate-spin text-indigo-600" />
          <p className="text-sm font-medium">Loading innovation data…</p>
        </div>
      </div>
    );
  }
  if (error) {
    return (
      <div className="min-h-screen bg-slate-50 flex items-center justify-center p-6">
        <div className="max-w-md bg-white rounded-2xl shadow-sm border border-rose-200 p-6">
          <div className="flex items-start gap-3">
            <AlertCircle className="w-6 h-6 text-rose-500 flex-shrink-0 mt-0.5" />
            <div>
              <h3 className="font-semibold text-slate-900">Couldn't load data</h3>
              <p className="text-sm text-slate-600 mt-1">{error}</p>
              <p className="text-xs text-slate-500 mt-3">
                Make sure all four CSV URLs are set correctly in <code className="bg-slate-100 px-1 rounded">CSV_URLS</code> at the top of the file.
              </p>
            </div>
          </div>
        </div>
      </div>
    );
  }

  // ---------- UI helpers ----------
  const ProgressBar = ({ value }) => (
    <div className="w-full bg-slate-100 rounded-full h-2 overflow-hidden">
      <div className="h-full rounded-full bg-gradient-to-r from-indigo-500 to-violet-500 transition-all" style={{ width: `${value}%` }} />
    </div>
  );

  const PercentDisplay = ({ item, mode = 'inline' }) => {
    if (item.percentLabel) {
      if (mode === 'big') return <span className="text-base font-semibold text-amber-700">{item.percentLabel}</span>;
      return <span className="inline-block rounded-full px-2.5 py-0.5 text-xs font-medium bg-amber-100 text-amber-700 whitespace-nowrap">{item.percentLabel}</span>;
    }
    if (mode === 'card' || mode === 'big') {
      return <span className={mode === 'big' ? 'text-2xl font-bold text-slate-900' : 'text-sm font-bold text-slate-900'}>{item.percent}%</span>;
    }
    return (
      <div className="flex items-center gap-2">
        <div className="flex-1"><ProgressBar value={item.percent} /></div>
        <span className="text-xs font-semibold text-slate-700 w-9 text-right">{item.percent}%</span>
      </div>
    );
  };

  const progressBadge = (p) => {
    const s = String(p).toLowerCase();
    if (s === 'not started') return 'bg-slate-100 text-slate-700';
    if (s === 'in progress') return 'bg-blue-100 text-blue-700';
    if (s === 'in sprint')   return 'bg-violet-100 text-violet-700';
    if (s === 'on hold')     return 'bg-amber-100 text-amber-700';
    if (s === 'in review' || s === 'review') return 'bg-emerald-100 text-emerald-700';
    return 'bg-slate-100 text-slate-700';
  };
  const statusBadge = (s) => {
    const v = String(s).toLowerCase();
    if (v === 'done' || v === 'completed' || v === 'closed') return 'bg-emerald-100 text-emerald-700';
    if (v === 'in progress' || v === 'active') return 'bg-blue-100 text-blue-700';
    if (v === 'to do' || v === 'new' || v === 'not started') return 'bg-slate-100 text-slate-700';
    if (v === 'blocked' || v === 'rejected') return 'bg-rose-100 text-rose-700';
    if (v === 'in review' || v === 'review') return 'bg-amber-100 text-amber-700';
    return 'bg-slate-100 text-slate-700';
  };
  const priorityBadge = (p) => {
    const v = String(p).toLowerCase();
    if (v.includes('urgent') || v.includes('critical') || v.includes('high')) return 'bg-rose-100 text-rose-700';
    if (v.includes('medium') || v.includes('normal')) return 'bg-amber-100 text-amber-700';
    if (v.includes('low')) return 'bg-slate-100 text-slate-600';
    return 'bg-slate-100 text-slate-600';
  };

  return (
    <div className="min-h-screen bg-slate-50 p-4 sm:p-6 lg:p-8">
      <div className="max-w-7xl mx-auto space-y-6">

        {/* Header */}
        <div className="flex items-center justify-between flex-wrap gap-3">
          <div>
            <h1 className="text-2xl sm:text-3xl font-bold text-slate-900 flex items-center gap-2">
              <Sparkles className="w-7 h-7 text-indigo-600" />
              Customer Enablement Innovation Center
            </h1>
            <p className="text-sm text-slate-500 mt-1">Live snapshot of completed and in-flight innovation work</p>
          </div>

          <div className="relative" onMouseEnter={() => setNavOpen(true)} onMouseLeave={() => setNavOpen(false)}>
            <button onClick={() => setNavOpen((o) => !o)} className="flex items-center gap-2 bg-white border border-slate-200 hover:border-indigo-300 hover:shadow-md text-slate-800 rounded-xl px-4 py-2.5 text-sm font-semibold transition-all">
              <Sparkles className="w-4 h-4 text-indigo-600" />
              CE Innovation Center
              <ChevronDown className={`w-4 h-4 text-slate-500 transition-transform ${navOpen ? 'rotate-180' : ''}`} />
            </button>
            {navOpen && (
              <div className="absolute right-0 top-full pt-2 z-40 w-72">
                <div className="bg-white rounded-xl shadow-xl border border-slate-200 overflow-hidden">
                  <a href="https://delteko365.sharepoint.com/sites/CustomerLearningExperience/SitePages/Innovation-Knowledge-Share.aspx" target="_blank" rel="noopener noreferrer" className="group flex items-center gap-3 px-4 py-3 hover:bg-blue-50 transition-colors border-b border-slate-100">
                    <div className="bg-blue-100 group-hover:bg-blue-200 rounded-lg p-2 transition-colors flex-shrink-0"><Hammer className="w-4 h-4 text-blue-600" /></div>
                    <div className="flex-1 min-w-0">
                      <p className="text-sm font-semibold text-slate-900">In the Works</p>
                      <p className="text-xs text-slate-500 truncate">Innovation Knowledge Share</p>
                    </div>
                    <ExternalLink className="w-3.5 h-3.5 text-slate-400 group-hover:text-blue-600 flex-shrink-0" />
                  </a>

                          {wi.priority && <span className={`inline-flex items-center gap-0.5 text-[10px] font-semibold rounded-full px-2 py-0.5 ${priorityBadge(wi.priority)}`}><Flag className="w-2.5 h-2.5" /> {wi.priority}</span>}
                        </div>
                        <span className="text-xs font-bold text-slate-700">{wi.percent}%</span>
                      </div>
                      <p className="text-sm font-semibold text-slate-900 leading-snug">{wi.title || '—'}</p>
                      {wi.description && <p className="text-xs text-slate-600 mt-1 leading-relaxed whitespace-pre-line">{wi.description}</p>}
                      <div className="mt-2 flex items-center gap-3">
                        {wi.assignedTo && <div className="flex items-center gap-1 text-xs text-slate-600 flex-shrink-0"><User className="w-3 h-3 text-slate-400" /><span className="truncate">{wi.assignedTo}</span></div>}
                        <div className="flex-1 min-w-[60px]"><ProgressBar value={wi.percent} /></div>
                      </div>
                    </div>
                  );

                  return (
                    <div>
                      <div className="flex items-center gap-2 mb-3">
                        <ListChecks className="w-4 h-4 text-indigo-600" />
                        <h5 className="text-sm font-semibold text-slate-900">Work Items</h5>
                        <span className="text-xs text-slate-500">({projectWorkItems.length})</span>
                      </div>
                      {projectWorkItems.length === 0 ? (
                        <div className="text-xs text-slate-500 bg-slate-50 rounded-lg p-4 text-center">No work items linked to this project.</div>
                      ) : (
                        <div className="space-y-4">
                          {groupOrder.map((key) => {
                            const items = groups[key];
                            if (items.length === 0) return null;
                            const def = groupDefs[key];
                            const Icon = def.icon;
                            return (
                              <div key={key}>
                                <div className="flex items-center gap-2 mb-2">
                                  <div className={`${def.iconBg} ${def.iconText} rounded-md p-1`}><Icon className="w-3.5 h-3.5" /></div>
                                  <h6 className="text-xs font-bold uppercase tracking-wide text-slate-700">{def.label}</h6>
                                  <span className={`text-[10px] font-bold rounded-full px-1.5 py-0.5 ${def.countCls}`}>{items.length}</span>
                                </div>
                                <div className="space-y-2">{items.map(renderItemCard)}</div>
                              </div>
                            );
                          })}
                        </div>
                      )}
                    </div>
                  );
                })()}
              </div>
              <div className="border-t border-slate-100 p-4 bg-slate-50 flex justify-end">
                <button onClick={() => setSelectedSprint(null)} className="px-4 py-2 bg-slate-900 text-white text-sm font-medium rounded-lg hover:bg-slate-700 transition-colors">Close</button>
              </div>
            </div>
          </div>
        );
      })()}
    </div>
  );
};

const root = createRoot(document.getElementById('root'));
root.render(<Dashboard />);
</script>
</body>
</html>
