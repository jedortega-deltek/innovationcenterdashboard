.93 28.3 121.08 28.37 121.23 28.44 121.36 28.52 121.48 28.64 121.6 28.76 121.68 28.88 121.75 29.04 121.82 29.19 121.85 29.35 121.85 29.53 121.85 29.7 121.82 29.86 121.75 30.01 121.68 30.16 121.6 30.29 121.48 30.41 121.36 30.53 121.24 30.61 121.08 30.68 120.92 30.75 120.77 30.78 120.59 30.78ZM120.59 30.51C120.78 30.51 120.95 30.47 121.1 30.39 121.24 30.31 121.36 30.19 121.44 30.04 121.52 29.89 121.56 29.72 121.56 29.53 121.56 29.33 121.52 29.16 121.44 29.02 121.36 28.87 121.24 28.76 121.1 28.68 120.96 28.6 120.79 28.56 120.59 28.56 120.4 28.56 120.23 28.6 120.09 28.68 119.95 28.76 119.83 28.88 119.75 29.02 119.67 29.17 119.63 29.34 119.63 29.53 119.63 29.72 119.67 29.89 119.75 30.04 119.83 30.19 119.95 30.3 120.09 30.39 120.24 30.47 120.4 30.51 120.59 30.51ZM120.13 30.18 120.13 28.84 120.62 28.84C120.76 28.84 120.87 28.88 120.96 28.96 121.05 29.04 121.09 29.14 121.09 29.27 121.09 29.36 121.07 29.43 121.02 29.5 120.97 29.57 120.91 29.62 120.83 29.66L121.14 30.18 120.85 30.18 120.58 29.7 120.37 29.7 120.37 30.18 120.13 30.18ZM120.38 29.47 120.62 29.47C120.68 29.47 120.73 29.45 120.77 29.42 120.81 29.39 120.83 29.34 120.83 29.28 120.83 29.22 120.81 29.17 120.77 29.14 120.73 29.1 120.67 29.09 120.61 29.09L120.38 29.09 120.38 29.47Z\" fill=\"#1742F5\"></path></g></g></g></svg>";

/* ---------- Deltek palette ---------- */
const C = {
  marine:'#1742F5', navy:'#070D63', ink:'#00021D', body:'#3C454E', muted:'#6B7683',
  faint:'#9AA3AE', border:'#EDEFF5', borderStrong:'#D5DAE6', bg:'#FCFDFF', white:'#fff', hairline:'#F2F4F9',
};
const TYPE_COLOR = {
  'Prompt':'#6D18F1','Automation':'#1742F5','Copilot Agent':'#3895FF',
  'GenAI Plug-in for ADO/TFS':'#00B6C3','Workflow & Tracking Solutions':'#C200CC',
  'Authoring Tool':'#070D63','SharePoint Site':'#7A62FF','Repository/Storage':'#94A3B8',
};
const FALLBACK = ['#1742F5','#6D18F1','#3895FF','#00B6C3','#C200CC','#7A62FF','#0B5FD6','#067A83','#94A3B8'];
const hashStr = (s)=>{let h=0;s=String(s);for(let i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h|=0;}return Math.abs(h);};
const colorForType = (t)=> TYPE_COLOR[t] || FALLBACK[hashStr(t)%FALLBACK.length];

const pillFor = (p)=>{
  const s=String(p).toLowerCase();
  if(s==='for review') return {bg:'rgba(0,182,195,.14)',color:'#067A83'};
  if(s==='in progress'||s==='active') return {bg:'rgba(23,66,245,.10)',color:'#1742F5'};
  if(s==='testing') return {bg:'rgba(109,24,241,.12)',color:'#6D18F1'};
  if(s==='completed'||s==='done'||s==='closed') return {bg:'rgba(0,182,195,.14)',color:'#067A83'};
  if(s==='not started'||s==='to do'||s==='new') return {bg:'#EDEFF5',color:'#5B6472'};
  if(s==='on hold') return {bg:'rgba(194,0,204,.10)',color:'#A800B0'};
  if(s.indexOf('demo')>=0) return {bg:'rgba(194,0,204,.10)',color:'#A800B0'};
  return {bg:'#EDEFF5',color:'#5B6472'};
};
const barColorFor = (pct)=> pct>=100 ? '#00B6C3' : '#1742F5';
const AV = [
  {bg:'rgba(23,66,245,.12)',color:'#1742F5'},{bg:'rgba(109,24,241,.12)',color:'#6D18F1'},
  {bg:'rgba(0,182,195,.16)',color:'#067A83'},{bg:'rgba(56,149,255,.16)',color:'#0B5FD6'},
];
const initialsOf = (name)=>{const p=String(name).trim().split(/\s+/);return (((p[0]||'')[0]||'')+((p[1]||'')[0]||'')).toUpperCase();};
const peopleOf = (expert)=> String(expert||'').split(';').map(x=>x.trim()).filter(Boolean);
const expertLabelOf = (people)=> people.length===0?'Unassigned':(people.length===1?people[0]:people[0].split(/\s+/)[0]+' +'+(people.length-1));

const EYEBROW = {fontSize:11,fontWeight:700,letterSpacing:'.08em',textTransform:'uppercase',margin:0};
const CARD = {background:C.white,border:'1px solid '+C.border,borderRadius:16};

const Dashboard = () => {
  const [loading,setLoading]=useState(true);
  const [error,setError]=useState(null);
  const [approved,setApproved]=useState([]);
  const [prompts,setPrompts]=useState([]);
  const [active,setActive]=useState([]);
  const [allProjects,setAllProjects]=useState([]);
  const [workItems,setWorkItems]=useState([]);
  const [query,setQuery]=useState('');
  const [sortConfig,setSortConfig]=useState({key:'percent',direction:'desc'});
  const [selectedSprintFilter,setSelectedSprintFilter]=useState(null);
  const [modal,setModal]=useState(null); // {kind:'type'|'approved'|'kpi'|'sprint', ...}

  /* ---------- helpers ---------- */
  const cleanValue=(v)=>{
    if(v===null||v===undefined||v==='')return '';
    if(typeof v==='number'||typeof v==='boolean')return v;
    if(Array.isArray(v))return v.map(cleanValue).filter(Boolean).join(', ');
    if(typeof v==='object'){
      if(v.Value!==undefined)return cleanValue(v.Value);
      if(v.DisplayName!==undefined)return cleanValue(v.DisplayName);
      if(v.results&&Array.isArray(v.results))return v.results.map(cleanValue).filter(Boolean).join(', ');
      return '';
    }
    const s=String(v).trim();
    if((s.startsWith('{')&&s.endsWith('}'))||(s.startsWith('[')&&s.endsWith(']'))){
      try{return cleanValue(JSON.parse(s));}catch(e){
        const m=s.match(/"Value"\s*:\s*"([^"]+)"/); if(m)return m[1];
        const n=s.match(/"DisplayName"\s*:\s*"([^"]+)"/); if(n)return n[1];
        return s;
      }
    }
    return s;
  };
  const getField=(row,...keys)=>{for(const k of keys){if(row[k]!==undefined&&row[k]!==null&&row[k]!=='')return cleanValue(row[k]);}return '';};
  const normalizePercent=(v)=>{if(v===null||v===undefined||v==='')return 0;let n=typeof v==='number'?v:parseFloat(String(v).replace('%','').trim());if(isNaN(n))return 0;if(n>0&&n<=1)n=n*100;return Math.max(0,Math.min(100,Math.round(n)));};
  const stripHtml=(raw)=>{
    if(raw===null||raw===undefined)return '';
    let s=String(raw);
    s=s.replace(/<\s*(br|\/p|\/div|\/li|\/h[1-6])\s*\/?>/gi,'\n').replace(/<[^>]+>/g,'');
    const ent={'&nbsp;':' ','&amp;':'&','&lt;':'<','&gt;':'>','&quot;':'"','&#39;':"'",'&apos;':"'",'&rsquo;':'\u2019','&lsquo;':'\u2018','&rdquo;':'\u201D','&ldquo;':'\u201C','&mdash;':'\u2014','&ndash;':'\u2013','&hellip;':'\u2026'};
    s=s.replace(/&[a-z#0-9]+;/gi,(m)=>{if(ent[m.toLowerCase()]!==undefined)return ent[m.toLowerCase()];const num=m.match(/^&#(\d+);$/);if(num){try{return String.fromCharCode(parseInt(num[1],10));}catch(e){return '';}}return '';});
    return s.replace(/[ \t]+/g,' ').replace(/\n{3,}/g,'\n\n').trim();
  };

  /* ---------- load ---------- */
  useEffect(()=>{
    const parseFile=(url,label)=>new Promise(async(resolve,reject)=>{
      try{
        const cb=(url.includes('?')?'&':'?')+'t='+Date.now();
        const res=await fetch(url+cb);
        if(!res.ok)throw new Error('HTTP '+res.status+' while fetching '+label);
        const text=await res.text();
        Papa.parse(text,{header:true,dynamicTyping:true,skipEmptyLines:true,transformHeader:(h)=>h.trim(),complete:(r)=>resolve(r.data),error:reject});
      }catch(err){reject(err);}
    });
    (async()=>{
      try{
        const [ar,pr,acr,wr]=await Promise.all([
          parseFile(CSV_URLS.approvedInnovations,'Approved Innovations'),
          parseFile(CSV_URLS.promptLibrary,'Prompt Library'),
          parseFile(CSV_URLS.shareYourProject,'Share Your Project'),
          parseFile(CSV_URLS.workItems,'Work Items'),
        ]);
        const approvedClean=ar.filter(r=>r&&getField(r,'Title')).map(r=>({title:getField(r,'Title'),solutionType:getField(r,'Solution Type','SolutionType')||'Other',id:getField(r,'ID')}));
        const promptClean=pr.filter(r=>r&&getField(r,'Title')).map(r=>({title:getField(r,'Title'),solutionType:'Prompt'}));
        const allProjectsClean=acr.filter(r=>r&&getField(r,'Title')).map(r=>{
          const archive=r['Archive']; const archiveStr=String(cleanValue(archive)).toLowerCase().trim();
          return {
            title:getField(r,'Title'), status:getField(r,'Status'), progress:getField(r,'Progress'),
            priority:getField(r,'Priority'), sprint:getField(r,'Sprint'), archive, archiveStr,
            expert:getField(r,'Innovation Expert/Partner','AIExpert_x002f_Partner','Innovation Expert','AI Expert/Partner'),
            percent:normalizePercent(getField(r,'% Completion','OData__x0025__x0020_Completion','Percent Complete')),
            solutionType:getField(r,'Solution Type','SolutionType'),
          };
        });
        const activeClean=allProjectsClean.filter(row=>{
          const s=String(row.status).toLowerCase(), p=String(row.progress).toLowerCase(), a=row.archiveStr;
          if(s==='approved'||s==='archived'||p==='approved'||p==='archived')return false;
          if(a==='approved'||a==='archived'||a==='yes'||a==='true'||a==='y'||a==='1'||a==='checked')return false;
          return true;
        });
        const workItemsClean=wr.filter(r=>r&&(getField(r,'Title')||getField(r,'Project'))).map(r=>({
          project:getField(r,'Project'), itemType:getField(r,'Item Type','ItemType'), title:getField(r,'Title'),
          description:stripHtml(getField(r,'Description')), assignedTo:getField(r,'Assigned To','AssignedTo'),
          status:getField(r,'Status'), percent:normalizePercent(getField(r,'% Complete','Percent Complete','PercentComplete')), priority:getField(r,'Priority'),
        }));
        setApproved(approvedClean); setPrompts(promptClean); setAllProjects(allProjectsClean); setActive(activeClean); setWorkItems(workItemsClean);
        setLoading(false);
      }catch(err){console.error(err);setError(err.message||'Failed to load data');setLoading(false);}
    })();
  },[]);

  /* ---------- derived ---------- */
  const completedAll=[...approved,...prompts];
  const totalCompleted=completedAll.length;
  const typeCounts=completedAll.reduce((a,it)=>{const t=it.solutionType||'Other';a[t]=(a[t]||0)+1;return a;},{});
  const typeSegments=Object.entries(typeCounts).sort((a,b)=>b[1]-a[1]).map(([type,count])=>({type,count,color:colorForType(type),width:totalCompleted?(count/totalCompleted*100):0}));

  const pipelineCount=active.filter(r=>String(r.progress).toLowerCase()==='not started').length;
  const inProgressCount=active.filter(r=>{const p=String(r.progress).toLowerCase();return p&&p!=='approved'&&p!=='on hold'&&p!=='not started';}).length;

  const availableSprints=Array.from(new Set(allProjects.map(r=>String(r.sprint).trim()).filter(s=>{if(!s)return false;const v=s.toLowerCase();return !['n/a','na','none','tbd','-'].includes(v);}))).sort((a,b)=>{
    const pk=(s)=>{const m=s.match(/^(\d{4})\s+S(\d+)/i);return m?[parseInt(m[1],10),parseInt(m[2],10)]:[0,0];};
    const[ay,an]=pk(a),[by,bn]=pk(b); if(ay!==by)return by-ay; return bn-an;
  });
  const activeSprintFilter = (selectedSprintFilter&&availableSprints.includes(selectedSprintFilter)) ? selectedSprintFilter : (availableSprints[0]||'');
  const sprintItems=allProjects.filter(r=>String(r.sprint).trim()===activeSprintFilter).sort((a,b)=>b.percent-a.percent);

  const sortedActive=[...active].filter(r=>String(r.progress).toLowerCase()!=='on hold').sort((a,b)=>{
    const {key,direction}=sortConfig; const dir=direction==='asc'?1:-1;
    if(key==='percent')return ((a.percent||0)-(b.percent||0))*dir;
    const av=String(a[key==='expert'?'expert':key]||'').toLowerCase(), bv=String(b[key==='expert'?'expert':key]||'').toLowerCase();
    return av<bv?-1*dir:av>bv?1*dir:0;
  });
  const q=query.trim().toLowerCase();
  const filteredActive=q?sortedActive.filter(it=>[it.title,it.expert,it.progress].map(v=>String(v||'').toLowerCase()).join(' | ').includes(q)):sortedActive;
  const allActiveCount=sortedActive.length;

  const handleSort=(key)=>setSortConfig(prev=>prev.key===key?{key,direction:prev.direction==='asc'?'desc':'asc'}:{key,direction:key==='percent'?'desc':'asc'});
  const SortIcon=({k})=>{if(sortConfig.key!==k)return <ArrowUpDown size={13} style={{color:C.faint}}/>;return sortConfig.direction==='asc'?<ArrowUp size={13} style={{color:C.marine}}/>:<ArrowDown size={13} style={{color:C.marine}}/>;};

  const showcaseUrl=(id)=>id!==undefined&&id!==null&&id!==''?('https://delteko365.sharepoint.com/sites/CustomerLearningExperience/Lists/Showcase/DispForm.aspx?ID='+id):null;
  const PROMPT_URL='https://delteko365.sharepoint.com/sites/CustomerLearningExperience/Lists/CLX%20Prompt%20Library/AllItems.aspx';

  /* ---------- avatars ---------- */
  const Avatars=({expert})=>{
    const ppl=peopleOf(expert);
    return (
      <div style={{display:'flex',alignItems:'center',gap:6}}>
        {ppl.slice(0,3).map((n,i)=>{const a=AV[hashStr(n)%AV.length];return <span key={i} style={{width:26,height:26,borderRadius:999,background:a.bg,color:a.color,fontSize:10,fontWeight:700,display:'flex',alignItems:'center',justifyContent:'center',border:'1.5px solid #fff',marginLeft:i?-6:0}}>{initialsOf(n)}</span>;})}
        <span style={{fontSize:12,color:C.muted,marginLeft:4}}>{expertLabelOf(ppl)}</span>
      </div>
    );
  };
  const Bar=({pct,h=6})=> <div style={{height:h,borderRadius:999,background:C.border,overflow:'hidden'}}><div style={{height:'100%',borderRadius:999,background:barColorFor(pct),width:pct+'%'}}/></div>;

  /* ---------- loading / error ---------- */
  if(loading) return (
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center'}}>
      <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:14,color:C.muted}}>
        <Loader2 size={38} style={{color:C.marine,animation:'spin 1s linear infinite'}}/>
        <style>{'@keyframes spin{to{transform:rotate(360deg)}}'}</style>
        <p style={{fontSize:14,fontWeight:600,margin:0}}>Loading innovation data…</p>
      </div>
    </div>
  );
  if(error) return (
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',padding:24}}>
      <div style={{...CARD,maxWidth:460,padding:24,borderColor:'#F3C9CE'}}>
        <div style={{display:'flex',gap:12}}>
          <AlertCircle size={22} style={{color:'#C200CC',flexShrink:0,marginTop:2}}/>
          <div>
            <h3 style={{fontSize:16,fontWeight:700,color:C.ink,margin:0}}>Couldn't load data</h3>
            <p style={{fontSize:14,color:C.body,margin:'6px 0 0'}}>{error}</p>
            <p style={{fontSize:12,color:C.faint,margin:'12px 0 0'}}>Make sure the four CSV files sit alongside this HTML file (same folder) and it is served over http/https, not opened from the file system.</p>
          </div>
        </div>
      </div>
    </div>
  );

  /* ---------- modal content ---------- */
  const closeModal=()=>setModal(null);
  const renderModal=()=>{
    if(!modal)return null;
    let maxW='640px', eyebrow='', title='', subtitle='', bodyEl=null;

    const listLayout=(items,withType)=> (
      <div style={{display:'flex',flexDirection:'column',gap:8}}>
        {items.length===0 ? <p style={{fontSize:14,color:C.faint,textAlign:'center',padding:'24px 0'}}>No items in this category.</p> :
          items.map((it,i)=>{
            const inner=(<>
              <span style={{flexShrink:0,width:24,height:24,borderRadius:999,background:'rgba(23,66,245,.10)',color:C.marine,fontSize:12,fontWeight:800,display:'flex',alignItems:'center',justifyContent:'center',marginTop:1}}>{i+1}</span>
              <span style={{flex:1,minWidth:0}}>
                <span style={{display:'block',fontSize:14,fontWeight:600,color:C.ink,lineHeight:1.4}}>{it.title}</span>
                {withType&&<span style={{display:'inline-flex',alignItems:'center',gap:6,marginTop:5}}><span style={{width:8,height:8,borderRadius:2,background:colorForType(it.type)}}/><span style={{fontSize:11,fontWeight:600,letterSpacing:'.03em',textTransform:'uppercase',color:C.muted}}>{it.type}</span></span>}
              </span>
              {it.url&&<ArrowUpRight size={15} style={{flexShrink:0,color:C.faint,marginTop:3}}/>}
            </>);
            const st={display:'flex',alignItems:'flex-start',gap:12,padding:'12px 14px',border:'1px solid '+C.border,borderRadius:10,textDecoration:'none'};
            return it.url

          })}
      </div>
    );

    if(modal.kind==='type'){
      const items=completedAll.filter(x=>(x.solutionType||'Other')===modal.type).map(x=>({title:x.title,url:x.solutionType==='Prompt'?PROMPT_URL:showcaseUrl(x.id)}));
      eyebrow='Solution Type'; title=modal.type; subtitle=items.length+(items.length===1?' approved innovation':' approved innovations');
      bodyEl=listLayout(items,false);
    } else if(modal.kind==='approved'){
      const items=completedAll.map(x=>({title:x.title,type:x.solutionType||'Other',url:x.solutionType==='Prompt'?PROMPT_URL:showcaseUrl(x.id)}));
      maxW='680px'; eyebrow='Approved'; title='Completed Innovations'; subtitle=items.length+' approved innovations';
      bodyEl=listLayout(items,true);
    } else if(modal.kind==='kpi'){
      const isPipe=modal.which==='pipeline';
      const items=active.filter(r=>{const p=String(r.progress).toLowerCase();return isPipe?p==='not started':(p&&p!=='approved'&&p!=='on hold'&&p!=='not started');}).sort((a,b)=>b.percent-a.percent);

      bodyEl=(
        <table style={{width:'100%',borderCollapse:'collapse',fontSize:14}}>

          </tr></thead>
          <tbody>{items.map((r,i)=>{const pl=pillFor(r.progress);const ppl=peopleOf(r.expert);return (
            <tr key={i} style={{borderBottom:'1px solid '+C.hairline}}>
              <td style={{padding:'12px 12px 12px 0',fontWeight:600,color:C.ink,maxWidth:260}}>{r.title}</td>
              <td style={{padding:12,color:C.body}}>{expertLabelOf(ppl)}</td>
              <td style={{padding:12}}><span style={{display:'inline-block',fontSize:11,fontWeight:700,letterSpacing:'.04em',textTransform:'uppercase',padding:'4px 10px',borderRadius:999,background:pl.bg,color:pl.color,whiteSpace:'nowrap'}}>{r.progress||'—'}</span></td>
              <td style={{padding:'12px 0 12px 12px'}}><div style={{display:'flex',alignItems:'center',gap:10}}><div style={{flex:1,minWidth:60}}><Bar pct={r.percent}/></div><span style={{fontSize:13,fontWeight:700,color:C.ink,width:34,textAlign:'right'}}>{r.percent}%</span></div></td>
            </tr>);})}</tbody>
        </table>
      );
    } else if(modal.kind==='sprint'){
      const it=modal.item; const ppl=peopleOf(it.expert);
      maxW='620px'; eyebrow='Sprint Project'; title=it.title; subtitle='';
      const detailRows=[
        ['Innovation Expert',ppl.join(', ')||'Unassigned'],

        ['Sprint',it.sprint||'—'],['Solution Type',it.solutionType||'—'],

      const raw=workItems.filter(w=>String(w.project).trim().toLowerCase()===String(it.title).trim().toLowerCase());
      const bucket=(w)=>{const s=String(w.status).toLowerCase(),t=String(w.itemType).toLowerCase();const done=s==='completed'||s==='done'||s==='closed';if(done&&t==='question/decision')return 'resolved';if(done)return 'completed';if(s==='not started'||s==='to do'||s==='new')return 'backlog';return 'inprogress';};
      const defs={inprogress:{label:'In Progress',color:'#1742F5'},backlog:{label:'Backlog',color:'#94A3B8'},completed:{label:'Completed',color:'#00B6C3'},resolved:{label:'Resolved',color:'#6D18F1'}};
      const order=['inprogress','backlog','completed','resolved'];
      const b={inprogress:[],backlog:[],completed:[],resolved:[]}; raw.forEach(w=>b[bucket(w)].push(w));
      const groups=order.filter(k=>b[k].length).map(k=>({...defs[k],items:b[k]}));
      bodyEl=(
        <div style={{display:'flex',flexDirection:'column',gap:20}}>
          <div style={{background:C.bg,border:'1px solid '+C.border,borderRadius:12,padding:'18px 20px'}}>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}}>
              <span style={{...EYEBROW,color:C.muted}}>Completion</span>
              <span style={{fontSize:22,fontWeight:800,color:C.ink}}>{it.percent}%</span>
            </div>
            <Bar pct={it.percent} h={8}/>
          </div>
          <div>{detailRows.map(([l,v])=>(
            <div key={l} style={{display:'grid',gridTemplateColumns:'130px 1fr',gap:12,padding:'11px 0',borderBottom:'1px solid '+C.hairline}}>
              <span style={{...EYEBROW,color:C.muted}}>{l}</span>
              <span style={{fontSize:14,color:C.ink,fontWeight:500}}>{v}</span>
            </div>))}
          </div>
          <div>
            <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:14}}>
              <ListChecks size={16} style={{color:C.marine}}/>
              <h4 style={{fontSize:15,fontWeight:700,color:C.ink,margin:0}}>Work Items <span style={{color:C.faint,fontWeight:600}}>({raw.length})</span></h4>
            </div>
            {raw.length===0 ? <div style={{padding:20,textAlign:'center',fontSize:13,color:C.faint,background:C.bg,border:'1px solid '+C.border,borderRadius:10}}>No work items linked to this project yet.</div> :

                {groups.map((g,gi)=>(
                  <div key={gi}>
                    <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:10}}>
                      <span style={{width:8,height:8,borderRadius:999,background:g.color}}/>

                    <div style={{display:'flex',flexDirection:'column',gap:8}}>
                      {g.items.map((w,wi)=>{const pl=pillFor(w.status);return (

                            <div style={{display:'flex',alignItems:'center',gap:6,flexWrap:'wrap'}}>
                              {w.itemType&&<span style={{fontSize:10,fontWeight:700,letterSpacing:'.04em',textTransform:'uppercase',padding:'3px 8px',borderRadius:6,background:'rgba(23,66,245,.08)',color:C.marine}}>{w.itemType}</span>}
                              {w.status&&<span style={{fontSize:10,fontWeight:700,letterSpacing:'.04em',textTransform:'uppercase',padding:'3px 8px',borderRadius:999,background:pl.bg,color:pl.color}}>{w.status}</span>}
                            </div>
                            <span style={{fontSize:12,fontWeight:800,color:C.ink}}>{w.percent}%</span>
                          </div>
                          <p style={{fontSize:13,fontWeight:700,color:C.ink,margin:'0 0 3px',lineHeight:1.4}}>{w.title||'—'}</p>
                          {w.description&&<p className="clamp2" style={{fontSize:12,color:C.muted,margin:0,lineHeight:1.5,whiteSpace:'pre-line'}}>{w.description}</p>}
                          <div style={{display:'flex',alignItems:'center',gap:6,marginTop:8}}>
                            <User size={12} style={{color:C.faint}}/>
                            <span style={{fontSize:12,color:C.muted}}>{w.assignedTo||'Unassigned'}</span>
                          </div>
                        </div>);})}
                    </div>
                  </div>))}
              </div>}
          </div>
        </div>
      );

    return (
      <div onClick={closeModal} style={{position:'fixed',inset:0,zIndex:50,background:'rgba(7,13,99,.42)',backdropFilter:'blur(3px)',display:'flex',alignItems:'center',justifyContent:'center',padding:24}}>

          <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:16,padding:'24px 28px',borderBottom:'1px solid '+C.border}}>
            <div style={{minWidth:0}}>
              <p style={{...EYEBROW,color:C.marine,marginBottom:5}}>{eyebrow}</p>
              <h3 style={{fontSize:20,fontWeight:700,color:C.ink,margin:0,letterSpacing:'-0.01em',lineHeight:1.25}}>{title}</h3>
              {subtitle&&<p style={{fontSize:13,color:C.muted,margin:'6px 0 0'}}>{subtitle}</p>}
            </div>
            <button className="iconbtn" onClick={closeModal} aria-label="Close" style={{flexShrink:0,background:'none',border:0,cursor:'pointer',color:C.faint,padding:6,borderRadius:8,display:'flex'}}><X size={20}/></button>
          </div>
          <div style={{padding:'20px 28px',overflowY:'auto'}}>{bodyEl}</div>
          <div style={{padding:'16px 28px',borderTop:'1px solid '+C.border,background:C.bg,display:'flex',justifyContent:'flex-end'}}>
            <button className="primary-btn" onClick={closeModal} style={{font:'inherit',fontSize:13,fontWeight:700,color:'#fff',background:C.marine,border:0,padding:'10px 20px',borderRadius:8,cursor:'pointer'}}>Close</button>
          </div>
        </div>
      </div>
    );
  };

  /* ---------- page ---------- */
  const statCard=(label,value,sub,onClick,dark)=>{
    const base={textAlign:'left',font:'inherit',borderRadius:16,padding:24,position:'relative',overflow:'hidden'};
    const inner=(<>
      <p style={{...EYEBROW,color:dark?'rgba(255,255,255,.72)':C.muted}}>{label}</p>
      <p style={{fontSize:52,fontWeight:800,lineHeight:1,margin:'14px 0 6px',letterSpacing:'-0.02em',color:dark?'#fff':C.ink}}>{value}</p>
      <p style={{fontSize:13,color:dark?'rgba(255,255,255,.72)':C.muted,margin:0}}>{sub}</p>
      {dark&&<CheckCircle2 size={20} style={{position:'absolute',top:20,right:20,color:'rgba(255,255,255,.4)'}}/>}
    </>);
    if(onClick) return <button className={dark?'':'card-hover'} onClick={onClick} style={{...base,cursor:'pointer',background:dark?C.navy:C.white,border:dark?0:'1px solid '+C.border,color:dark?'#fff':'inherit'}}>{inner}</button>;
    return <div style={{...base,background:dark?C.navy:C.white,border:dark?0:'1px solid '+C.border,color:dark?'#fff':'inherit'}}>{inner}</div>;
  };

    <div style={{minHeight:'100vh',background:C.bg}}>

            <span style={{fontSize:15,fontWeight:700,color:C.ink,letterSpacing:'-0.01em',whiteSpace:'nowrap'}}>Innovation Center</span>
          </div>
          <nav style={{display:'flex',alignItems:'center',gap:8}}>
            <a className="navlink" href="https://delteko365.sharepoint.com/sites/CustomerLearningExperience/SitePages/Innovation-Knowledge-Share.aspx" target="_blank" rel="noopener noreferrer" style={{fontSize:13,fontWeight:600,color:C.body,padding:'8px 12px'}}>In the Works</a>
            <a className="navlink" href="https://delteko365.sharepoint.com/sites/CustomerLearningExperience/SitePages/Innovation-Showcase.aspx" target="_blank" rel="noopener noreferrer" style={{fontSize:13,fontWeight:600,color:C.body,padding:'8px 12px'}}>Showcase</a>
            <a className="navlink" href="https://delteko365.sharepoint.com/sites/CustomerLearningExperience/Lists/CLX%20Prompt%20Library/AllItems.aspx" target="_blank" rel="noopener noreferrer" style={{fontSize:13,fontWeight:600,color:C.body,padding:'8px 12px'}}>Prompt Library</a>
          </nav>
        </div>
      </header>

      <main style={{maxWidth:1240,margin:'0 auto',padding:'48px 32px 64px'}}>
        <div style={{maxWidth:720,marginBottom:40}}>
          <p style={{...EYEBROW,color:C.marine,fontSize:12,marginBottom:12}}>Customer Enablement</p>
          <h1 style={{fontSize:44,lineHeight:1.05,letterSpacing:'-0.02em',fontWeight:800,color:C.ink,margin:'0 0 16px'}}>From idea to impact.</h1>
          <p style={{fontSize:18,lineHeight:1.55,color:C.body,margin:0}}>Every innovation the team is building and deploying tracked in one place.</p>
        </div>

        <section style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:16,marginBottom:16}}>
          {statCard('Approved',totalCompleted,'completed innovations',()=>setModal({kind:'approved'}),true)}
          {statCard('In progress',inProgressCount,'actively underway',()=>setModal({kind:'kpi',which:'inprogress'}),false)}
          {statCard('Pipeline',pipelineCount,'not yet started',()=>setModal({kind:'kpi',which:'pipeline'}),false)}
          {statCard('This sprint',sprintItems.length,'in active development',null,false)}
        </section>

        <section style={{...CARD,padding:'28px 32px',marginBottom:16}}>
          <div style={{display:'flex',alignItems:'baseline',justifyContent:'space-between',gap:16,marginBottom:20,flexWrap:'wrap'}}>
            <div>
              <p style={{...EYEBROW,color:C.marine,marginBottom:4}}>Portfolio</p>
              <h2 style={{fontSize:22,fontWeight:700,color:C.ink,margin:0,letterSpacing:'-0.01em'}}>Approved Innovations by Solution Type</h2>
            </div>
            <span style={{fontSize:13,color:C.muted}}>{totalCompleted} total approved</span>
          </div>
          <div style={{display:'flex',height:14,borderRadius:999,overflow:'hidden',gap:2,marginBottom:22}}>
            {typeSegments.map((s,i)=><div key={i} title={s.type} style={{height:'100%',background:s.color,width:s.width+'%'}}/>)}

          <div style={{display:'flex',flexWrap:'wrap',gap:10}}>

              <button key={i} className="chip" onClick={()=>setModal({kind:'type',type:s.type})} style={{display:'inline-flex',alignItems:'center',gap:8,background:'#fff',border:'1px solid '+C.border,padding:'7px 8px 7px 12px',borderRadius:999,cursor:'pointer',font:'inherit'}}>
                <span style={{width:10,height:10,borderRadius:3,background:s.color,flexShrink:0}}/>
                <span style={{fontSize:13,fontWeight:600,color:C.body}}>{s.type}</span>
                <span style={{fontSize:12,fontWeight:800,color:C.ink,background:C.hairline,borderRadius:999,padding:'1px 8px'}}>{s.count}</span>
              </button>))}
          </div>
        </section>

        <section style={{margin:'40px 0 16px'}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:16,marginBottom:20,flexWrap:'wrap'}}>

              <p style={{...EYEBROW,color:C.marine,marginBottom:4}}>Portfolio</p>
              <h2 style={{fontSize:22,fontWeight:700,color:C.ink,margin:0,letterSpacing:'-0.01em'}}>All Active Projects <span style={{fontSize:15,fontWeight:600,color:C.faint}}>{q&&filteredActive.length!==allActiveCount?filteredActive.length+' of '+allActiveCount:allActiveCount}</span></h2>
            </div>

            </div>
          </div>
          {filteredActive.length===0 ? <div style={{padding:40,textAlign:'center',color:C.faint,fontSize:14}}>{q?'No projects match "'+query+'".':'No active projects.'}</div> :
            <div style={{overflowX:'auto'}}>
              <table style={{width:'100%',borderCollapse:'collapse',fontSize:14}}>
                <thead><tr style={{background:C.bg,borderBottom:'1px solid '+C.border}}>
                  {[['Project','title'],['Innovation Expert','expert'],['Status','progress'],['Completion','percent']].map(([l,k],i)=>(
                    <th key={k} style={{textAlign:'left',padding:i===1||i===2?'14px 20px':'14px 24px',minWidth:k==='percent'?150:'auto'}}>
                      <button onClick={()=>handleSort(k)} style={{background:'none',border:0,font:'inherit',...EYEBROW,color:C.muted,cursor:'pointer',display:'inline-flex',alignItems:'center',gap:5}}>{l} <SortIcon k={k}/></button>
                    </th>))}
                </tr></thead>
                <tbody>{filteredActive.map((it,i)=>{const pl=pillFor(it.progress);return (
                  <tr key={i} className="trow" style={{borderBottom:'1px solid '+C.hairline}}>
                    <td style={{padding:'16px 24px',fontWeight:600,color:C.ink,maxWidth:320}}>{it.title}</td>
                    <td style={{padding:'16px 20px',color:C.body}}>{expertLabelOf(peopleOf(it.expert))}</td>
                    <td style={{padding:'16px 20px'}}><span style={{display:'inline-block',fontSize:11,fontWeight:700,letterSpacing:'.04em',textTransform:'uppercase',padding:'4px 10px',borderRadius:999,background:pl.bg,color:pl.color,whiteSpace:'nowrap'}}>{it.progress||'—'}</span></td>
                    <td style={{padding:'16px 24px'}}><div style={{display:'flex',alignItems:'center',gap:12}}><div style={{flex:1,minWidth:70}}><Bar pct={it.percent}/></div><span style={{fontSize:13,fontWeight:700,color:C.ink,width:38,textAlign:'right'}}>{it.percent}%</span></div></td>
                  </tr>);})}</tbody>
              </table>
            </div>}
        </section>

        <p style={{textAlign:'center',fontSize:12,color:C.faint,margin:'32px 0 0'}}>Data sourced from Approved Innovations, Prompt Library, Share Your Project, and Work Items.</p>
      </main>

      <footer style={{background:C.marine,padding:'36px 32px',textAlign:'center'}}>
        <p style={{fontSize:13,fontWeight:700,letterSpacing:'.16em',textTransform:'uppercase',color:'#fff',margin:'0 0 8px'}}>Deltek</p>
        <p style={{fontSize:13,color:'rgba(255,255,255,.78)',margin:'0 auto',maxWidth:560}}>Customer Enablement Innovation Center — speed, clarity, and control across the project lifecycle.</p>
      </footer>

      {renderModal()}
    </div>
  );
};

createRoot(document.getElementById('root')).render(<Dashboard />);
</script>
</body>
</html>
